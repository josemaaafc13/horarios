<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horarios Gatsby</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F5F8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HORARIOS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  /* Layout: cabecera fija con la semana, una tarjeta por dia (apiladas en movil, rejilla en ancho),
     barra inferior de acciones para quien edita y paneles inferiores para asignar turnos y opciones.
     Tema unico claro, elegido por el usuario para leerlo bien a plena luz. */
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#131A26; --muted:#586374; --line:#DCE1E8; --soft:#EDF0F4;
  --scrim:rgba(19,26,38,.45); --on-ink-tag:rgba(255,255,255,.2);
  --b1-bg:#FFF1CC; --b1-fg:#6B4700;
  --b2-bg:#FFE2D6; --b2-fg:#8A2E10;
  --b3-bg:#EADFFB; --b3-fg:#4B2291;
  --b4-bg:#DCE4FF; --b4-fg:#1F347F;
  --ok:#17794A; --ok-bg:#DDF3E6; --warn:#8A4B00; --warn-bg:#FFE9C7; --danger:#B3261E; --danger-bg:#FCE4E2;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}

.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:0 32px}
.wrap.editing{padding-block-end:104px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:14px 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font:800 24px/1 var(--display);letter-spacing:-.02em}
.status{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.weeknav{display:flex;align-items:center;gap:6px;flex:1 1 260px;max-width:440px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px}
.nav{width:44px;height:44px;border-radius:10px;font-size:24px;line-height:1;background:var(--soft)}
.wk{text-align:center;min-width:0}
.wk strong{display:block;font:700 18px/1.15 var(--display);font-variant-numeric:tabular-nums}
.wk span{display:block;font-size:12px;color:var(--muted);min-height:16px}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-block:4px 14px}
.chip{font-size:14px;font-weight:600;padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.solid{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.red{background:var(--danger-bg);border-color:var(--danger-bg);color:var(--danger)}
.ask{font-size:14px;font-weight:600;flex-basis:100%}

.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note p{flex:1 1 200px;min-width:0}
.note.plain{background:var(--surface);border:1px solid var(--line);color:var(--ink)}

.pick{display:flex;align-items:center;gap:10px;margin-block:4px 14px}
.pick label{font-size:14px;font-weight:600;white-space:nowrap}
.pick select{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;padding:0 12px}

.mine{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.mine h2{font:700 16px/1.2 var(--display);margin-bottom:10px}
.mine-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mine-cell{text-align:center;min-width:0}
.mine-cell b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.mine-cell span{display:block;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:7px 0;border-radius:8px}
.mine-cell span.free{background:var(--soft);color:var(--muted);font-weight:500}
.mine-cell em{display:block;font-style:normal;font-size:11px;font-weight:800;margin-top:3px}

.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.day.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.day header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day h2{font:700 20px/1.1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.day h2 span{color:var(--muted);font-weight:600}
.badge{font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--surface);padding:4px 7px;border-radius:6px}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:flex-start}
.time{flex:none;min-width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;line-height:1.2;padding:7px 8px;border-radius:9px}
.b1{background:var(--b1-bg);color:var(--b1-fg)}
.b2{background:var(--b2-bg);color:var(--b2-fg)}
.b3{background:var(--b3-bg);color:var(--b3-fg)}
.b4{background:var(--b4-bg);color:var(--b4-fg)}
.names{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.who{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;line-height:1.2;padding:7px 10px;border-radius:9px;background:var(--soft);overflow-wrap:anywhere}
.who.me{background:var(--ink);color:var(--surface);font-weight:700}
.mk{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 4px;border-radius:5px;background:var(--ink);color:var(--surface);font:800 11px/1 var(--body)}
.mk.big{min-width:28px;height:28px;font-size:14px;border-radius:8px}
.who.me .mk,.person.on .mk{background:var(--surface);color:var(--ink)}
.empty{color:var(--muted);font-size:14px}
.off{font-size:13px;color:var(--muted)}
.off b{font-weight:700;color:var(--ink)}
.add{border:1.5px dashed var(--line);border-radius:10px;min-height:46px;font-weight:600;font-size:15px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}
.btn{min-height:48px;border-radius:12px;font-weight:600;font-size:15px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.ghost{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.primary[disabled]{background:var(--soft);color:var(--muted);cursor:default}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.wide{width:100%}

.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.enter{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.enter{animation:none}.knob::after{transition:none}}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet-head{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 12px}
.sheet-head small{display:block;color:var(--muted);font-size:13px}
.sheet-head h3{font:700 22px/1.15 var(--display);overflow-wrap:anywhere}
.sheet-head .btn{min-height:42px;padding:0 16px;flex:none}
.acts{display:flex;gap:8px;flex:none}
.sheet.full{max-width:none;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column}
.pv{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pv img{display:block;width:100%}
.pv.zoom img{width:auto;max-width:none;height:100%}
.pv p{padding:16px;margin:0}
.back{display:block;font-size:13px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.label{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{min-height:48px;border-radius:12px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;border:2.5px solid transparent}
.preset.on{border-color:var(--ink)}
.adjust{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.step{min-height:44px;border-radius:10px;background:var(--soft);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.now{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums;text-align:center;margin-top:14px}
.switch{width:100%;margin-top:10px;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);text-align:left}
.switch.on{border-color:var(--ink);background:var(--soft)}
.switch .tx{flex:1;min-width:0}
.switch .tx b{display:block;font-size:15px;line-height:1.2}
.switch .tx small{display:block;font-size:12px;color:var(--muted)}
.knob{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative}
.knob::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch.on .knob{background:var(--ink)}
.switch.on .knob::after{transform:translateX(18px)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person{min-height:50px;border-radius:12px;border:1.5px solid var(--line);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:16px;line-height:1.15;text-align:left;min-width:0}
.person .nm{min-width:0;overflow-wrap:anywhere}
.person .rt{flex:none;display:flex;align-items:center;gap:5px}
.person.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tag{flex:none;font-size:13px;font-weight:700;padding:3px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.person.on .tag{background:var(--on-ink-tag);color:inherit}
.hint{font-size:13px;color:var(--muted);margin-top:10px}

.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;text-align:left}
.mrow span{min-width:0}
.mrow b{display:block;font-size:16px}
.mrow small{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mrow i{font-style:normal;font-size:22px;line-height:1;color:var(--muted)}

.staff{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}
.field{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-weight:500;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.icon{flex:none;width:42px;height:46px;border-radius:10px;background:var(--soft);font-size:17px;line-height:1}
.icon[disabled]{opacity:.35;cursor:default}
.icon.red{background:var(--danger-bg);color:var(--danger)}
.sub{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:-2px}
.swap{flex:none;font-size:12px;font-weight:700;color:var(--ink);padding:6px 10px;border-radius:999px;background:var(--soft)}
.confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;font-weight:600}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.addrow .btn{padding:0 18px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .hn{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.mset{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.mset label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-width:0}
.mset .field{width:auto;min-width:118px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--soft);margin-bottom:10px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px var(--scrim)}
.preview{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:340px;background:var(--bg)}
.preview img{display:block;width:100%}
.preview p{padding:16px;margin:0}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msg{min-height:120px;resize:vertical}
.pday{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.pd-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pd-h b{font:700 17px/1.1 var(--display)}
.edit-btn{flex:none;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--soft)}
.who.unk{background:var(--warn-bg);color:var(--warn);font-weight:700}
.who.unk.out{text-decoration:line-through;opacity:.6}
.unk-row{display:flex;flex-direction:column;gap:6px;margin-block:10px;font-size:14px}
.seg.three{grid-template-columns:repeat(3,1fr);margin:0}
.seg.three button{font-size:13px;line-height:1.15;padding:4px}
.copybox{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 24px;text-align:center}
.gate-logo{border-radius:20px;margin-bottom:6px}
.gate h1{font:800 34px/1 var(--display);letter-spacing:-.02em}
.gate-sub{color:var(--muted);font-weight:600;margin-bottom:14px}
.gate-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;text-align:left}
.gate-form label:not(.btn){font-size:13px;font-weight:700;color:var(--muted)}
.gate-form .field{min-height:52px;font-size:18px}
.gate-msg{color:var(--muted);max-width:320px}
.gate-err{color:var(--danger);font-weight:600;max-width:320px}
.gate .chip{margin-top:14px}
label.btn{cursor:pointer}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
</style>
</head>
<body>
<div id="root"></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var BAR = 'Gatsby';
  var DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  var DAYS_S = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  var MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var MONTHS_S = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var BAND = { 1: ['#FFF1CC', '#6B4700'], 2: ['#FFE2D6', '#8A2E10'], 3: ['#EADFFB', '#4B2291'], 4: ['#DCE4FF', '#1F347F'] };
  var MARK_NAME = { S: 'Seguido', H: 'H' };

  /* ---------- utilidades ---------- */
  function $(id) { return document.getElementById(id); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toMin(t) { var a = t.split(':'); return (+a[0]) * 60 + (+a[1]); }
  function fromMin(m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  /* la madrugada (antes de las 06:00) cuenta como final de la noche */
  function sortKey(t) { var m = toMin(t); return m < 360 ? m + 1440 : m; }
  function byTime(a, b) { return sortKey(a) - sortKey(b); }
  function band(t) { var m = toMin(t); if (m < 360) return 4; if (m < 900) return 1; if (m < 1050) return 2; if (m < 1260) return 3; return 4; }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateOf(key) { var a = key.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function mondayKey(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return keyOf(x); }
  function shiftWeek(key, n) { var d = dateOf(key); d.setDate(d.getDate() + 7 * n); return keyOf(d); }
  function dayDate(key, i) { var d = dateOf(key); d.setDate(d.getDate() + i); return d; }
  function weekShort(key) {
    var a = dayDate(key, 0), b = dayDate(key, 6);
    return a.getMonth() === b.getMonth()
      ? a.getDate() + ' – ' + b.getDate() + ' ' + MONTHS_S[b.getMonth()]
      : a.getDate() + ' ' + MONTHS_S[a.getMonth()] + ' – ' + b.getDate() + ' ' + MONTHS_S[b.getMonth()];
  }
  function weekLong(key) {
    var a = dayDate(key, 0), b = dayDate(key, 6);
    return a.getMonth() === b.getMonth()
      ? 'del ' + a.getDate() + ' al ' + b.getDate() + ' de ' + MONTHS[b.getMonth()]
      : 'del ' + a.getDate() + ' de ' + MONTHS[a.getMonth()] + ' al ' + b.getDate() + ' de ' + MONTHS[b.getMonth()];
  }
  function weekRel(key) {
    var diff = Math.round((dateOf(key) - dateOf(mondayKey(new Date()))) / 604800000);
    return diff === 0 ? 'Esta semana' : diff === 1 ? 'Semana que viene' : diff === -1 ? 'Semana pasada' : '';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  /* ---------- estado ---------- */
  /* Un turno se guarda como "HH:MM" mas una letra opcional de marca: "15:45S", "22:00H". */
  function tOf(v) { return v ? v.slice(0, 5) : ''; }
  function mOf(v) { return v ? v.slice(5) : ''; }

  var CFG = window.HORARIOS_CONFIG || {};

  var state = clone(SEED);

  var ui = {

    dirty: false, publishing: false, conflict: false, offline: false,
    loginErr: '', loginBusy: false, bootErr: '',

    design: lsGet('hb-design') === 'list' ? 'list' : 'cal',
    copyText: '', shareBlob: null, shareUrl: '', photoUrl: ''
  };

  function normalize(st) {
    var ver = st.v || 1;
    if (!st.marks) st.marks = { s: '15:45', h: '18:00' };
    if (!st.times) st.times = [];
    if (ver < 2) {
      var i = st.times.indexOf('11:30');
      if (i >= 0) { if (st.times.indexOf('23:30') < 0) st.times[i] = '23:30'; else st.times.splice(i, 1); }
    }
    /* v3: la H pasa a admitirse desde las 18:00 (antes 22:00) */
    if (ver < 3 && st.marks.h === '22:00') st.marks.h = '18:00';
    st.v = 3;
    st.times.sort(byTime);
    (st.staff || (st.staff = [])).forEach(function (p) { if (p.type !== 'extra') p.type = 'fijo'; });
    if (!st.weeks) st.weeks = {};

  }
  /* marca que admite una hora: S en la hora exacta de apertura, H desde la hora de noche en adelante */
  function markFor(t) {

  function extras() { return state.staff.filter(function (p) { return p.type === 'extra'; }); }

    state = normalize(clone(published));

    if (draft && draft.state) { state = normalize(draft.state); ui.dirty = true; if (draft.baseRev !== published.rev) ui.conflict = true; }
    undoStack = []; lastKey = null; lastSnap = JSON.stringify(state); baseDirty = ui.dirty;
  }
  /* deshacer: una pila con el estado anterior a cada cambio (solo en memoria) */
  var undoStack = [], lastSnap = null, lastKey = null, baseDirty = false;

  function saveDraft() { lsSet('hb-draft', { baseRev: published.rev, state: state }); }

  function touch(key) {

  function undo() {

  }
  function person(pid) { for (var i = 0; i < state.staff.length; i++) if (state.staff[i].id === pid) return state.staff[i]; return null; }
  function dayMap(wk, d, create) {
    var W = state.weeks[wk];

    var D = W[d];

  }
  function setShift(wk, d, pid, v) { var D = dayMap(wk, d, true); if (v == null) delete D[pid]; else D[pid] = v; touch(); }

  function retime(v, t) { var m = mOf(v); return t + (m && markFor(t) === m ? m : ''); }
  function slotsOf(wk, d) {
    var D = dayMap(wk, d), by = {};
    state.staff.forEach(function (p) { var v = D[p.id]; if (v) (by[tOf(v)] = by[tOf(v)] || []).push({ p: p, m: mOf(v) }); });
    return Object.keys(by).sort(byTime).map(function (t) { return { t: t, people: by[t] }; });
  }
  function weekHasData(wk) { for (var d = 0; d < 7; d++) if (slotsOf(wk, d).length) return true; return false; }

  function editing() { return true; }

  function timePicker(cur) {

      cTxt(x, String(dayDate(wk, i).getDate()), P + IN, y + IN + 78, '800 54px ' + FD, C_INK);
      var rx = P + IN + DAYW, ry = y + IN;
      if (!L.rows.length) cTxt(x, 'Sin turnos', rx, ry + 38, '500 29px ' + FB, C_MUTED);
      L.rows.forEach(function (rw) {
        var col = BAND[band(rw.t)];
        x.fillStyle = col[0]; rr(x, rx, ry, PILL, CH, 14); x.fill();
        cTxt(x, rw.t, rx + PILL / 2, ry + 38, '700 31px ' + FB, col[1], 'center');
        rw.lines.forEach(function (ln, k) {
          var cx = rx + PILL + 14, cy = ry + k * (CH + CG);
          ln.forEach(function (chip) {
            x.fillStyle = C_SOFT; rr(x, cx, cy, chip.w, CH, 12); x.fill();
            cTxt(x, chip.name, cx + PADX, cy + 38, cFit(x, chip.name, '500', 31, FB, chip.w - PADX * 2 - (chip.m ? BD + 8 : 0), 16), C_INK);
            if (chip.m) cBadge(x, chip.m, cx + chip.w - PADX - BD, cy + (CH - BD) / 2, BD);
            cx += chip.w + CG;
          });
        });
        ry += rw.h + 12;
      });
      y += L.h + G;
    });
    return c;
  }
  function makeImage(design, done) {
    var wk = ui.week;
    var ready = document.fonts && document.fonts.load
      ? Promise.all([document.fonts.load("500 26px 'Figtree'"), document.fonts.load("700 24px 'Figtree'"), document.fonts.load("800 17px 'Figtree'"), document.fonts.load("700 27px 'Bricolage Grotesque'"), document.fonts.load("800 46px 'Bricolage Grotesque'")]).catch(function () {})
      : Promise.resolve();
    ready.then(function () { done(design === 'list' ? drawList(wk) : drawCalendar(wk)); });
  }
  function prepareShare() {
    ui.shareUrl = ''; ui.shareBlob = null; ui.copyText = '';
    makeImage(ui.design, function (c) {
      ui.shareUrl = c.toDataURL('image/png');
      c.toBlob(function (b) { ui.shareBlob = b; }, 'image/png');
      if (ui.sheet && ui.sheet.type === 'share') renderSheet();
    });
  }
  /* la vista previa es siempre el calendario horizontal y refleja los cambios aun sin guardar */
  function preparePhoto() {
    ui.photoUrl = '';
    makeImage('cal', function (c) { ui.photoUrl = c.toDataURL('image/png'); if (ui.sheet && ui.sheet.type === 'photo') renderSheet(); });
  }

  /* ---------- nube: Firebase por REST, sin librerias ---------- */
  /* Una sola cuenta compartida (CFG.email) y un solo documento con el horario entero en JSON.
     Las direcciones se pueden sustituir desde config.js para probar contra un servidor local. */
  var API = {
    signIn: CFG.authUrl || 'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword',
    token: CFG.tokenUrl || 'https://securetoken.googleapis.com/v1/token',
    doc: (CFG.firestoreUrl || 'https://firestore.googleapis.com/v1') + '/projects/' + encodeURIComponent(CFG.projectId || '') + '/databases/(default)/documents/horarios/gatsby'
  };
  var session = lsGet('hb-session');
  function fail(code, msg) { var e = new Error(msg || code); e.code = code; return e; }
  function http(url, opts) {
    return fetch(url, opts).then(function (r) {
      return r.text().then(function (t) { var b = null; try { b = t ? JSON.parse(t) : null; } catch (e) {} return { ok: r.ok, status: r.status, body: b }; });
    }, function () { throw fail('network'); });
  }
  function keep(tokens) {
    session = { refresh: tokens.refresh, id: tokens.id, exp: Date.now() + (parseInt(tokens.ttl, 10) - 120) * 1000 };
    lsSet('hb-session', session);
  }
  function signIn(password) {
    return http(API.signIn + '?key=' + encodeURIComponent(CFG.apiKey), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: CFG.email, password: password, returnSecureToken: true }) }).then(function (r) {
      if (!r.ok) {
        var m = (r.body && r.body.error && r.body.error.message) || '';
        throw fail(/TOO_MANY_ATTEMPTS/.test(m) ? 'throttle' : /INVALID|EMAIL_NOT_FOUND|MISSING_PASSWORD/.test(m) ? 'bad' : 'server', m);
      }
      keep({ refresh: r.body.refreshToken, id: r.body.idToken, ttl: r.body.expiresIn });
    });
  }
  function signOut() { session = null; lsSet('hb-session', null); }
  function idToken() {
    if (!session) return Promise.reject(fail('auth'));
    if (session.id && Date.now() < session.exp) return Promise.resolve(session.id);
    return http(API.token + '?key=' + encodeURIComponent(CFG.apiKey), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(session.refresh) }).then(function (r) {
      if (!r.ok) { if (r.status >= 400 && r.status < 500) { signOut(); throw fail('auth'); } throw fail('server'); }
      keep({ refresh: r.body.refresh_token || session.refresh, id: r.body.id_token, ttl: r.body.expires_in });
      return session.id;
    });
  }
  function authed(url, opts) {
    return idToken().then(function (tk) {
      opts = opts || {}; opts.headers = opts.headers || {}; opts.headers.Authorization = 'Bearer ' + tk;
      return http(url, opts);
    }).then(function (r) {
      if (r.status === 401) { signOut(); throw fail('auth'); }
      if (r.status === 403) throw fail('denied');
      return r;
    });
  }
  /* devuelve { state, updateTime } o null si aun no hay nada guardado */
  function cloudLoad() {
    return authed(API.doc).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok || !r.body || !r.body.fields || !r.body.fields.json) throw fail('server');
      return { state: JSON.parse(r.body.fields.json.stringValue), updateTime: r.body.updateTime };
    });
  }
  /* guarda solo si nadie ha guardado desde `updateTime`; si no hay `updateTime`, solo si el documento no existe */
  function cloudSave(st, updateTime) {
    var q = updateTime ? 'currentDocument.updateTime=' + encodeURIComponent(updateTime) : 'currentDocument.exists=false';
    return authed(API.doc + '?' + q, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { json: { stringValue: JSON.stringify(st) } } }) }).then(function (r) {
      if (r.ok && r.body && r.body.updateTime) return r.body.updateTime;
      var stt = r.body && r.body.error && r.body.error.status;
      if (r.status === 409 || stt === 'FAILED_PRECONDITION' || stt === 'ALREADY_EXISTS' || stt === 'ABORTED') throw fail('conflict');
      throw fail('server');
    });
  }
  function adopt(doc) {
    published = normalize(doc.state); cloud.updateTime = doc.updateTime;
    lsSet('hb-cache', { state: published, updateTime: doc.updateTime });
  }

  /* ---------- arranque y entrada ---------- */
  function start() {
    ui.bootErr = ''; ui.offline = false;
    if (!CFG.apiKey || !CFG.projectId || !CFG.email) { ui.screen = 'setup'; render(); return; }
    if (!session) { ui.screen = 'login'; render(); return; }
    if (ui.screen !== 'app') { ui.screen = 'boot'; render(); }
    cloudLoad().then(function (doc) {
      if (!doc) { ui.screen = 'empty'; render(); return; }
      ui.conflict = false; adopt(doc); loadWorking(); ui.screen = 'app'; render();
    }).catch(function (e) {
      if (e.code === 'auth') { ui.screen = 'login'; ui.loginErr = 'La sesión ha caducado. Vuelve a entrar.'; render(); return; }
      var cached = lsGet('hb-cache');
      if (e.code === 'network' && cached && cached.state) {
        ui.conflict = false; published = normalize(cached.state); cloud.updateTime = cached.updateTime; loadWorking();
        ui.offline = true; ui.screen = 'app'; render(); return;
      }
      ui.screen = 'boot';
      ui.bootErr = e.code === 'network' ? 'No hay conexión a internet.' : e.code === 'denied' ? 'Esta cuenta no tiene permiso para ver el horario. Revisa las reglas de Firebase.' : 'No se pudo cargar el horario.';
      render();
    });
  }
  function doLogin() {
    var inp = $('pw'), pw = inp ? inp.value : '';
    if (!pw || ui.loginBusy) return;
    ui.loginBusy = true; ui.loginErr = ''; renderMain();
    signIn(pw).then(function () { ui.loginBusy = false; start(); }, function (e) {
      ui.loginBusy = false;
      ui.loginErr = e.code === 'bad' ? 'Contraseña incorrecta.' : e.code === 'throttle' ? 'Demasiados intentos. Espera unos minutos.' : e.code === 'network' ? 'No hay conexión a internet.' : 'No se pudo entrar. Inténtalo de nuevo.';
      renderMain();
      var again = $('pw'); if (again) again.focus();
    });
  }
  /* primera vez: sube a la nube el horario de partida (vacio o la copia de datos elegida) */
  function createFirst(st) {
    var first = normalize(clone(st));
    first.rev = 1; first.updated = new Date().toISOString(); delete first.example; delete first.link;
    ui.bootErr = ''; ui.screen = 'boot'; render();
    cloudSave(first, null).then(function (ut) {
      adopt({ state: first, updateTime: ut }); lsSet('hb-draft', null); loadWorking(); ui.screen = 'app'; render();
      toast('Horario guardado en la nube.');
    }, function (e) {
      if (e.code === 'conflict') { start(); return; }
      if (e.code === 'auth') { ui.screen = 'login'; render(); return; }
      ui.screen = 'empty'; ui.bootErr = e.code === 'network' ? 'No hay conexión a internet.' : 'No se pudo guardar. Inténtalo de nuevo.'; render();
    });
  }
  function importFile(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var st = null;
      try { st = JSON.parse(String(fr.result)); } catch (e) {}
      if (!st || !Array.isArray(st.staff) || typeof st.weeks !== 'object' || !Array.isArray(st.times)) { ui.bootErr = 'Ese archivo no es una copia de datos del horario.'; render(); return; }
      createFirst(st);
    };
    fr.onerror = function () { ui.bootErr = 'No se pudo leer el archivo.'; render(); };
    fr.readAsText(file);
  }
  /* al volver a la app se comprueba si otra persona ha guardado algo */
  function refresh(loud) {
    if (ui.screen !== 'app' || ui.publishing || !session) return;
    cloudLoad().then(function (doc) {
      ui.offline = false;
      if (!doc || doc.updateTime === cloud.updateTime) { renderMain(); return; }
      if (ui.dirty) { ui.conflict = true; renderMain(); return; }
      adopt(doc); loadWorking(); render();
      toast('Horario actualizado con los cambios de otra persona.');
    }).catch(function (e) {
      if (e.code === 'auth') { ui.screen = 'login'; ui.loginErr = 'La sesión ha caducado. Vuelve a entrar.'; render(); }
      else if (loud) toast(e.code === 'network' ? 'Sigue sin haber conexión.' : 'No se pudo cargar. Inténtalo de nuevo.');
    });
  }

  /* ---------- guardar ---------- */
  function publish() {
    var out = clone(state), limit = shiftWeek(mondayKey(new Date()), -8);
    Object.keys(out.weeks).forEach(function (k) { if (k < limit) delete out.weeks[k]; });
    out.rev = (published.rev || 0) + 1; out.updated = new Date().toISOString(); delete out.example; delete out.link;
    ui.publishing = true; renderMain();
    cloudSave(out, cloud.updateTime).then(function (ut) {
      adopt({ state: out, updateTime: ut }); lsSet('hb-draft', null);
      ui.publishing = false; ui.offline = false; ui.conflict = false; loadWorking(); render();
      toast('Guardado. El resto ya ve estos cambios.');
    }, function (e) {
      ui.publishing = false;
      if (e.code === 'conflict') { ui.conflict = true; toast('Otra persona guardó antes que tú.'); }
      else if (e.code === 'auth') { ui.screen = 'login'; ui.loginErr = 'La sesión ha caducado. Vuelve a entrar; tus cambios siguen en este móvil.'; }
      else if (e.code === 'network') toast('Sin conexión. Tus cambios siguen en este móvil; guarda cuando vuelva.');
      else if (e.code === 'denied') toast('Esta cuenta no tiene permiso para guardar.');
      else toast('No se pudo guardar. Inténtalo de nuevo.');
      render();
    });
  }
  /* conflicto: quedarse con lo de la otra persona, o guardar lo propio por encima */
  function takeTheirs() {
    cloudLoad().then(function (doc) {
      if (doc) adopt(doc);
      lsSet('hb-draft', null); ui.conflict = false; loadWorking(); render();
      toast('Ahora ves la versión guardada.');
    }).catch(function () { toast('No se pudo cargar. Inténtalo de nuevo.'); });
  }
  function keepMine() {
    cloudLoad().then(function (doc) {
      if (doc) { cloud.updateTime = doc.updateTime; published.rev = (normalize(doc.state).rev || 0); saveDraft(); }
      ui.conflict = false; publish();
    }).catch(function () { toast('No se pudo guardar. Inténtalo de nuevo.'); });
  }

  /* ---------- instalar como app ---------- */
  var deferredPrompt = null;
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); deferredPrompt = ev; if (ui.sheet && ui.sheet.type === 'install') renderSheet(); });

  /* ---------- acciones ---------- */
  function act(a, el) {
    var d = el.dataset, s = ui.sheet, cur;
    switch (a) {
      case 'prev': ui.week = shiftWeek(ui.week, -1); ui.confirm = null; ssSet('hb-week', ui.week); break;
      case 'next': ui.week = shiftWeek(ui.week, 1); ui.confirm = null; ssSet('hb-week', ui.week); break;
      case 'undo': undo(); break;
      case 'install': ui.sheet = { type: 'install' }; break;
      case 'install-now': if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } ui.sheet = null; break;
      case 'logout': signOut(); ui.sheet = null; ui.loginErr = ''; ui.screen = 'login'; break;
      case 'retry': if (ui.screen === 'app') refresh(true); else start(); return;
      case 'seed-empty': createFirst(SEED); return;
      case 'conflict-theirs': takeTheirs(); return;
      case 'conflict-mine': keepMine(); return;
      case 'clear': if (!weekHasData(ui.week)) { toast('Esta semana ya está vacía.'); return; } ui.confirm = 'clear'; break;
      case 'clear-yes': delete state.weeks[ui.week]; ui.confirm = null; touch(); break;
      case 'cancel': ui.confirm = null; break;
      case 'add': ui.sheet = { type: 'add', d: +d.d }; ui.mark = false; break;
      case 'shift': ui.sheet = { type: 'shift', d: +d.d, p: d.p }; break;
      case 'opts': ui.sheet = { type: 'opts' }; break;
      case 'staff': ui.sheet = { type: 'staff' }; ui.confirmDel = null; break;
      case 'hours': ui.sheet = { type: 'hours' }; break;
      case 'share': ui.sheet = { type: 'share' }; prepareShare(); break;
      case 'photo': ui.sheet = { type: 'photo', zoom: false }; preparePhoto(); break;
      case 'zoom': s.zoom = !s.zoom; break;
      case 'paste': ui.sheet = { type: 'paste', text: '', choice: {}, useView: false, edit: null }; break;
      case 'paste-edit':
        s.edit = +d.d; ui.mark = false;
        var es = draftSlots(draftOf(s), s.edit); if (es.length) ui.sel = es[es.length - 1].t;
        break;
      case 'paste-back': s.edit = null; break;
      case 'paste-who': s.choice[d.n] = d.k; break;
      case 'paste-week': s.useView = !s.useView; break;
      case 'paste-apply': applyPaste(s); break;
      case 'design': if (ui.design === d.k) return; ui.design = d.k === 'list' ? 'list' : 'cal'; lsSet('hb-design', ui.design); prepareShare(); break;
      case 'close': ui.sheet = null; break;
      case 'scrim': if (el !== act.target) return; ui.sheet = null; break;
      case 'time':
        if (s.type === 'shift') setShift(ui.week, s.d, s.p, retime(dayMap(ui.week, s.d)[s.p], d.t));
        else { ui.sel = d.t; ui.mark = false; }
        break;
      case 'step':
        if (s.type === 'shift') { cur = dayMap(ui.week, s.d)[s.p]; setShift(ui.week, s.d, s.p, retime(cur, fromMin(toMin(tOf(cur)) + (+d.n)))); }
        else { ui.sel = fromMin(toMin(ui.sel) + (+d.n)); ui.mark = false; }
        break;
      case 'mark': ui.mark = !ui.mark; break;
      case 'pmark':
        cur = dayMap(ui.week, s.d)[s.p];
        setShift(ui.week, s.d, s.p, tOf(cur) + (mOf(cur) ? '' : markFor(tOf(cur))));
        break;
      case 'assign':
        var target = ui.sel + (ui.mark ? markFor(ui.sel) : '');
        if (s.type === 'paste') { var dm = draftOf(s).map[s.edit]; if (dm[d.p] === target) delete dm[d.p]; else dm[d.p] = target; s.touched = true; break; }
        setShift(ui.week, s.d, d.p, dayMap(ui.week, s.d)[d.p] === target ? null : target);
        break;
      case 'remove': setShift(ui.week, s.d, s.p, null); ui.sheet = null; break;
      case 'type': var tp = person(d.p); if (!tp) return; tp.type = tp.type === 'extra' ? 'fijo' : 'extra'; touch(); break;
      case 'up': case 'down':
        var me = person(d.p), grp = state.staff.filter(function (p) { return p.type === me.type; });
        var other = grp[grp.indexOf(me) + (a === 'up' ? -1 : 1)];
        if (!other) return;
        var i = state.staff.indexOf(me), j = state.staff.indexOf(other);
        state.staff[i] = other; state.staff[j] = me; touch(); break;
      case 'del': ui.confirmDel = d.p; break;
      case 'del-no': ui.confirmDel = null; break;
      case 'del-yes':
        state.staff = state.staff.filter(function (p) { return p.id !== d.p; });
        Object.keys(state.weeks).forEach(function (k) { for (var n = 0; n < 7; n++) if (state.weeks[k][n]) delete state.weeks[k][n][d.p]; });
        ui.confirmDel = null; touch(); break;
      case 'newperson': addPerson(d.k); return;
      case 'addtime': addTime(); return;
      case 'deltime':
        if (state.times.length < 2) return;
        state.times = state.times.filter(function (t) { return t !== d.t; }); touch(); break;
      case 'publish': if (ui.dirty && !ui.publishing) publish(); return;
      case 'copytext': copyText(); return;
      case 'saveimg': saveImage(); return;
      default: return;
    }
    render();
  }
  function validTime(v) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(v); }
  function addPerson(kind) {
    var inp = $('new-' + kind), name = inp ? inp.value.trim() : '';
    if (!name) { if (inp) inp.focus(); return; }
    state.staff.push({ id: 'p' + (state.nextId++), name: name, type: kind === 'extra' ? 'extra' : 'fijo' });
    touch(); render();
    var again = $('new-' + kind); if (again) again.focus();
  }
  function addTime() {
    var inp = $('newtime'), v = inp ? inp.value : '';
    if (!validTime(v)) { toast('Elige una hora para añadirla.'); if (inp) inp.focus(); return; }
    if (state.times.indexOf(v) >= 0) { toast('Esa hora ya está en la lista.'); return; }
    state.times.push(v); state.times.sort(byTime); touch(); render();
  }
  function copyText() {
    var txt = shareText(ui.week);
    var done = function () { toast('Texto copiado. Pégalo en el grupo de WhatsApp.'); };
    var fallback = function () { ui.copyText = txt; renderSheet(); var b = $('copybox'); if (b) { b.focus(); b.select(); } toast('Selecciona el texto y cópialo.'); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  }
  /* en el movil abre el menu de compartir (WhatsApp incluido); en ordenador descarga el archivo */
  function saveImage() {
    if (!ui.shareBlob) { toast('La imagen todavía se está preparando.'); return; }
    var name = 'horario-' + ui.week + (ui.design === 'list' ? '-lista' : '-calendario') + '.png', file = null;
    try { file = new File([ui.shareBlob], name, { type: 'image/png' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
    var a = document.createElement('a'), url = URL.createObjectURL(ui.shareBlob);
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('Imagen descargada.');
  }

  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    act.target = ev.target;
    act(el.dataset.act, el);
  });
  root.addEventListener('input', function (ev) {
    var t = ev.target, k = t.dataset && t.dataset.inp;
    if (k === 'name') { var p = person(t.dataset.p); if (p) { p.name = t.value; touch('name:' + p.id); renderMain(); } }
    else if (k === 'msg' && ui.sheet && ui.sheet.type === 'paste') { ui.sheet.text = t.value; var po = $('paste-out'); if (po) po.innerHTML = pasteOut(ui.sheet); }
    /* el panel no se repinta al teclear (se perderia el foco): se enciende el boton de deshacer a mano */
    var ub = $('undo-btn'); if (ub) ub.hidden = !undoStack.length;
  });
  root.addEventListener('change', function (ev) {
    var t = ev.target, k = t.dataset && t.dataset.inp;
    if (t.id === 'seed-file') { if (t.files && t.files[0]) importFile(t.files[0]); }
    else if ((k === 'mks' || k === 'mkh') && validTime(t.value)) { state.marks[k === 'mks' ? 's' : 'h'] = t.value; touch(); render(); }
  });
  root.addEventListener('keydown', function (ev) {
    var kind = ev.target.dataset && ev.target.dataset.new;
    if (ev.key === 'Enter' && kind) { ev.preventDefault(); addPerson(kind); }
    if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); }
  });

  root.addEventListener('submit', function (ev) { if (ev.target.id === 'login-form') { ev.preventDefault(); doLogin(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(false); });
  window.addEventListener('online', function () { if (ui.screen === 'app') refresh(false); else if (ui.bootErr) start(); });

  /* ---------- arranque ---------- */
  state = normalize(state);
  render();
  start();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
